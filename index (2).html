<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal — Digital Sales Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
:root{
  --ink:#141E28; --ink2:#1D2A38; --ink3:#27374A;
  --paper:#F4F6F7; --card:#FFFFFF; --line:#E2E7EA; --line2:#CBD4DA;
  --txt:#1B2733; --txt2:#5A6B7A; --txt3:#8797A5;
  --teal:#0E8A6D; --teal-bg:#E4F3EE; --teal-dk:#085B47;
  --amber:#B27011; --amber-bg:#FBF1DD; --amber-dk:#7A4C08;
  --red:#C13B3B; --red-bg:#FAE8E8; --red-dk:#8A2626;
  --blue:#2D6FB8; --blue-bg:#E7F0FA; --blue-dk:#1B4A80;
  --slate:#5C6B7A; --slate-bg:#EDF0F2;
  --mono:'IBM Plex Mono',monospace; --disp:'Sora',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--txt);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
a{color:var(--blue)}

.app{display:flex;min-height:100vh}
.side{width:212px;background:var(--ink);color:#B8C4CE;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{padding:20px 18px 16px;border-bottom:1px solid var(--ink3)}
.logo .mark{font-family:var(--disp);font-weight:600;font-size:17px;color:#fff;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.logo .mark::before{content:"";width:10px;height:10px;background:var(--teal);border-radius:2px;display:inline-block;transform:rotate(45deg)}
.logo .sub{font-size:11px;color:#6E7E8C;margin-top:3px}
.nav{padding:12px 10px;flex:1}
.nav button{display:flex;width:100%;text-align:left;background:none;border:none;color:#B8C4CE;padding:9px 10px;border-radius:6px;font-size:13.5px;margin-bottom:2px;align-items:center;gap:10px}
.nav button .k{font-family:var(--mono);font-size:11px;color:#5E7080;margin-left:auto}
.nav button:hover{background:var(--ink2);color:#fff}
.nav button.on{background:var(--ink3);color:#fff}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#5E7080;padding:14px 10px 6px}
.side .foot{padding:14px 18px;border-top:1px solid var(--ink3);font-size:11px;color:#6E7E8C;line-height:1.6}

.main{flex:1;min-width:0}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:14px}
.top h1{font-family:var(--disp);font-size:18px;font-weight:600}
.top .crumb{color:var(--txt3);font-size:13px}
.top .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.pill-btn{background:var(--ink);color:#fff;border:none;padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500}
.pill-btn.ghost{background:none;color:var(--txt2);border:1px solid var(--line2)}
.wrap{padding:24px 28px;max-width:1180px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--txt2);margin-bottom:4px}
.kpi .v{font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:-.02em}
.kpi .d{font-family:var(--mono);font-size:11.5px;margin-top:3px}
.up{color:var(--teal)} .dn{color:var(--red)} .fl{color:var(--txt3)}

.tierstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px;background:var(--card)}
.tier{padding:16px 18px;border-right:1px solid var(--line);position:relative;cursor:pointer;transition:background .12s}
.tier:last-child{border-right:none}
.tier:hover{background:#FAFBFC}
.tier::before{content:"";position:absolute;top:0;left:0;right:0;height:3px}
.tier.t-a1::before{background:var(--teal)} .tier.t-a2::before{background:var(--amber)}
.tier.t-b1::before{background:var(--slate)} .tier.t-b2::before{background:var(--red)}
.tier .tn{font-size:12px;font-weight:600;letter-spacing:.02em;margin-bottom:2px}
.tier .td{font-size:11.5px;color:var(--txt2);margin-bottom:10px}
.tier .tv{font-family:var(--disp);font-size:21px;font-weight:600}
.tier .tv small{font-size:12px;color:var(--txt3);font-weight:500;font-family:'Inter'}
.tier .tm{font-family:var(--mono);font-size:11px;color:var(--txt2);margin-top:2px}

.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
@media(max-width:980px){.cols{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.panel h3{font-size:13px;font-weight:600;padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel h3 .cnt{font-family:var(--mono);font-size:11px;color:var(--txt3);font-weight:400}
.panel h3 .act{margin-left:auto;font-size:12px;color:var(--blue);background:none;border:none;font-weight:500}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3);font-weight:600;padding:9px 16px;border-bottom:1px solid var(--line);background:#FAFBFC}
td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer} tr.click:hover td{background:#F7FAFB}
.num{font-family:var(--mono);font-size:12.5px;text-align:right}
th.num{text-align:right}

.badge{display:inline-block;font-size:11px;font-weight:600;padding:2.5px 9px;border-radius:20px;white-space:nowrap}
.b-a1{background:var(--teal-bg);color:var(--teal-dk)} .b-a2{background:var(--amber-bg);color:var(--amber-dk)}
.b-b1{background:var(--slate-bg);color:#3D4A56} .b-b2{background:var(--red-bg);color:var(--red-dk)}
.b-esc{background:var(--red-bg);color:var(--red-dk)} .b-auto{background:var(--slate-bg);color:#3D4A56}
.b-pql{background:var(--blue-bg);color:var(--blue-dk)} .b-new{background:var(--teal-bg);color:var(--teal-dk)}
.grade{display:inline-flex;width:24px;height:24px;border-radius:6px;align-items:center;justify-content:center;font-weight:600;font-size:12.5px;font-family:var(--disp)}
.g-A{background:var(--teal-bg);color:var(--teal-dk)} .g-B{background:var(--blue-bg);color:var(--blue-dk)} .g-C{background:var(--slate-bg);color:#3D4A56}
.editrow{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13px}
.editrow:last-child{border-bottom:none}
.editrow label{color:var(--txt2);width:130px;flex-shrink:0}
.editrow input[type=range]{flex:1;accent-color:var(--blue)}
.editrow .rv{font-family:var(--mono);font-size:12px;width:42px;text-align:right}
.editrow select,.editrow input[type=number]{border:1px solid var(--line2);border-radius:6px;padding:5px 8px;font-size:13px;font-family:inherit}
.editrow textarea{flex:1;border:1px solid var(--line2);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;resize:vertical;min-height:54px}
.gset{display:flex;gap:6px}
.gset button{width:34px;height:30px;border:1px solid var(--line2);background:var(--card);border-radius:6px;font-weight:600;font-family:var(--disp);font-size:13px;color:var(--txt2)}
.gset button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.savebar{padding:12px 16px;display:flex;gap:8px;align-items:center}
.savebar .saved{font-size:12px;color:var(--teal-dk);opacity:0;transition:opacity .3s}
.savebar .saved.show{opacity:1}
.repcard{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
.repcard .rhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.repcard .rhead b{font-family:var(--disp);font-size:15px}
.repcard .gsum{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:12px;color:var(--txt2)}
.maptip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 11px;border-radius:6px;opacity:0;transition:opacity .12s;white-space:nowrap;z-index:5;transform:translate(-50%,-130%)}
.maptip b{font-family:var(--disp)}
#worldmap svg{display:block;width:100%;height:auto}
#worldmap path.country{stroke:#fff;stroke-width:.5;transition:opacity .15s;cursor:default}
#worldmap path.country.inplay{cursor:pointer}
#worldmap path.country.inplay:hover{opacity:.75}
.crumbbar{display:flex;gap:6px;align-items:center;font-size:12.5px;margin-left:auto}
.crumbbar button{background:none;border:none;color:var(--blue);font-size:12.5px;padding:2px 4px}
.crumbbar span{color:var(--txt3)}
.crumbbar b{font-family:var(--disp);font-size:12.5px}
.geo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:14px 16px}
.geo-card{border:1px solid var(--line);border-radius:10px;padding:13px 15px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;position:relative;overflow:hidden}
.geo-card::before{content:"";position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--gc,#5C6B7A)}
.geo-card:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 4px 14px rgba(20,30,40,.08)}
.geo-card .gn{font-size:12.5px;font-weight:600;margin-bottom:2px}
.geo-card .gv{font-family:var(--disp);font-size:20px;font-weight:600;letter-spacing:-.02em}
.geo-card .gm{font-family:var(--mono);font-size:11px;color:var(--txt2);margin-top:3px;line-height:1.6}
@keyframes ping{0%{r:3;opacity:.9}70%{r:11;opacity:0}100%{r:11;opacity:0}}
.risk-dot{fill:#C13B3B}
.risk-ping{fill:none;stroke:#C13B3B;stroke-width:1.5;animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
.kpi,.panel,.tier{transition:box-shadow .15s}
.kpi:hover{box-shadow:0 3px 12px rgba(20,30,40,.07)}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));border-bottom:1px solid var(--line)}
.statcell{padding:14px 16px;border-right:1px solid var(--line)}
.statcell:last-child{border-right:none}
.statcell .sl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3);font-weight:600;margin-bottom:4px}
.statcell .sv{font-family:var(--disp);font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.statcell .ss{font-family:var(--mono);font-size:11px;color:var(--txt2);margin-top:3px}
.pct{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:500;padding:2px 8px;border-radius:12px;min-width:44px;text-align:center}
.p-good{background:var(--teal-bg);color:var(--teal-dk)} .p-mid{background:var(--amber-bg);color:var(--amber-dk)} .p-bad{background:var(--red-bg);color:var(--red-dk)}
.autoline{display:flex;gap:22px;flex-wrap:wrap;padding:11px 16px;border-bottom:1px solid var(--line);background:#FAFBFC;font-size:12.5px;color:var(--txt2)}
.autoline b{font-family:var(--mono);color:var(--txt);font-weight:500}
.cfgrow{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.cfgrow:last-child{border-bottom:none}
.cfgrow label{color:var(--txt2);flex:1;min-width:200px}
.cfgrow input[type=number]{border:1px solid var(--line2);border-radius:6px;padding:5px 8px;width:74px;font-size:13px;font-family:var(--mono)}
.switch{position:relative;width:36px;height:20px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--line2);border-radius:12px;transition:.15s;cursor:pointer}
.switch i::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s}
.switch input:checked+i{background:var(--teal)}
.switch input:checked+i::after{left:18px}
.evt{display:flex;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.evt:last-child{border-bottom:none}
.evt .ic{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.ic-auto{background:var(--slate-bg)} .ic-human{background:var(--teal-bg)} .ic-in{background:var(--blue-bg)} .ic-quote{background:var(--amber-bg)}
.evt .ed{width:52px;color:var(--txt3);font-family:var(--mono);font-size:11.5px;flex-shrink:0}
.evt .et{flex:1;min-width:0}
.evt .et b{font-weight:500}
.evt .st{display:flex;gap:6px;align-items:center;flex-shrink:0}
.evt .st .pct{min-width:0}
.evt button{background:none;border:1px solid var(--line2);border-radius:6px;padding:4px 10px;font-size:12px;flex-shrink:0}
.evt button:hover{border-color:var(--ink)}
.evt.upcoming{background:#FAFBFC}
.msgbody{background:var(--surface-1,#F7F9FA);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:13px;line-height:1.65;margin-top:10px;white-space:pre-line}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;padding:13px 16px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;user-select:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary:hover{background:#FAFBFC}
details.sec>summary .chev{margin-left:auto;color:var(--txt3);font-size:12px;transition:transform .15s}
details.sec:not([open])>summary .chev{transform:rotate(-90deg)}
details.sec[open]>summary{border-bottom:1px solid var(--line)}
.sec .secbody{padding:14px;background:var(--paper)}
.sec .secbody .panel{margin-bottom:14px}

.hbar{width:64px;height:6px;background:var(--slate-bg);border-radius:3px;display:inline-block;vertical-align:middle;margin-right:8px;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:3px}
.hs{font-family:var(--mono);font-size:12px}

.fbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.fbar button{background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:6px 14px;font-size:12.5px;color:var(--txt2)}
.fbar button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fbar input{border:1px solid var(--line2);border-radius:8px;padding:7px 12px;font-size:13px;font-family:inherit;width:220px;margin-left:auto}
.fbar input:focus{outline:2px solid var(--blue);outline-offset:0;border-color:transparent}

.brief-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.avat{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex-shrink:0}
.brief-head h2{font-family:var(--disp);font-size:20px;font-weight:600}
.brief-head .meta{color:var(--txt2);font-size:13px;margin-top:2px}
.callout{border-radius:10px;padding:13px 16px;font-size:13px;margin-bottom:16px;display:flex;gap:10px;line-height:1.55}
.co-warn{background:var(--amber-bg);color:var(--amber-dk)}
.co-red{background:var(--red-bg);color:var(--red-dk)}
.co-play{background:var(--blue-bg);color:var(--blue-dk)}
.co-play b{display:block;margin-bottom:3px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .l{font-size:11.5px;color:var(--txt2)}
.stat .v{font-family:var(--disp);font-size:19px;font-weight:600;margin-top:2px}
.kv{font-size:13px}
.kv tr td:first-child{color:var(--txt2);width:46%}
.kv tr td:last-child{text-align:right;font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.actions button{background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:500;color:var(--txt)}
.actions button:hover{border-color:var(--ink);background:#FAFBFC}

.funnel{padding:16px}
.fstep{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.fstep .fl2{width:150px;font-size:12.5px;color:var(--txt2);flex-shrink:0}
.fstep .fb{flex:1;height:26px;background:var(--slate-bg);border-radius:5px;overflow:hidden;position:relative}
.fstep .fb i{display:block;height:100%;background:var(--blue);border-radius:5px 0 0 5px}
.fstep .fv{font-family:var(--mono);font-size:12px;width:130px;text-align:right;flex-shrink:0}

.seqrow td:first-child{font-weight:500}
.mini{font-size:11.5px;color:var(--txt3)}
.spark{font-family:var(--mono);font-size:12px}

.modal-bg{position:fixed;inset:0;background:rgba(16,24,32,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:14px;max-width:560px;width:100%;max-height:82vh;overflow-y:auto;padding:24px}
.modal h4{font-family:var(--disp);font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.modal .ai{font-size:11px;background:var(--blue-bg);color:var(--blue-dk);padding:2px 8px;border-radius:10px;font-weight:600}
.modal .body{font-size:13.5px;line-height:1.65;color:var(--txt);margin-top:12px;white-space:pre-line}
.modal .close{margin-top:18px;width:100%;background:var(--ink);color:#fff;border:none;padding:10px;border-radius:8px;font-size:13px;font-weight:500}
.note{font-size:12px;color:var(--txt3);margin-top:14px;line-height:1.6}

.emptybar{padding:24px;text-align:center;color:var(--txt3);font-size:13px}
@media(max-width:820px){.side{display:none}.wrap{padding:16px}.top{padding:12px 16px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo">
      <div class="mark">Signal</div>
      <div class="sub">Digital sales console · demo</div>
    </div>
    <nav class="nav">
      <div class="grp">Console</div>
      <button data-v="dash" class="on">Overview <span class="k">1</span></button>
      <button data-v="team">Team <span class="k">2</span></button>
      <button data-v="accounts">Accounts <span class="k">3</span></button>
    </nav>
    <div class="foot">Demo environment.<br>All data is synthetic.<br>Built by Blake Luken.</div>
  </aside>

  <div class="main">
    <div class="top">
      <h1 id="ttl">Overview</h1>
      <span class="crumb" id="crumb">10,000 accounts · 5 reps · AMER / EMEA / LATAM</span>
      <div class="right">
        <button class="pill-btn ghost" onclick="openModal('about')">How this works</button>
        <button class="pill-btn" onclick="openModal('weekly')">Run weekly digest</button>
      </div>
    </div>
    <div class="wrap" id="view"></div>
  </div>
</div>

<div class="modal-bg" id="modalbg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h4 id="mttl"></h4>
    <div class="body" id="mbody"></div>
    <button class="close" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
// ---------- synthetic data ----------
const TIERS = {
  a1:{name:"Top · healthy", desc:"Rep expansion motion", cls:"t-a1", badge:"b-a1", color:"#0E8A6D"},
  a2:{name:"Top · at risk", desc:"Rep rescue, manager visibility", cls:"t-a2", badge:"b-a2", color:"#B27011"},
  b1:{name:"Tail · healthy", desc:"Fully automated", cls:"t-b1", badge:"b-b1", color:"#5C6B7A"},
  b2:{name:"Tail · at risk", desc:"Auto rescue → escalate", cls:"t-b2", badge:"b-b2", color:"#C13B3B"}
};
const REPS = ["S. Okafor (AMER)","J. Meyer (EMEA)","L. Prieto (LATAM)","T. Nguyen (AMER)","R. Bakker (EMEA)"];
const REP_META = {
 "S. Okafor (AMER)":{quota:1900000,ytd:71,nrr:106,grr:91,committed:412000,best:505000,focus:"Strong expansion motion — protect Meridian rescue this month"},

function badge(t){return `<span class="badge ${TIERS[t].badge}">${TIERS[t].name}</span>`}
function initials(n){return n.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase()}
const avatColors=[["#E4F3EE","#085B47"],["#E7F0FA","#1B4A80"],["#FBF1DD","#7A4C08"],["#F0EAF8","#54348C"]];

// ---------- views ----------
let state = {view:"dash", tier:"all", q:"", acct:null};

function render(){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===state.view));
  const V = {dash, team, rep:repPage, accounts, brief}[state.view] || dash;
  $("#view").innerHTML = V();
  const titles={dash:"Overview",team:"Team",rep:"Rep",accounts:"Accounts",brief:"Account"};
  $("#ttl").textContent = titles[state.view];
  window.scrollTo(0,0);
}

function dash(){
  const counts={}, arrs={};
  Object.keys(TIERS).forEach(t=>{const s=FULL.filter(f=>f.tier===t);counts[t]=s.length;arrs[t]=kf$(s.reduce((x,f)=>x+f.arr,0))});
  const due90=FULL.filter(f=>f.renew<=90), esc90=FULL.filter(f=>f.trigger&&(f.arr>8000));
  const esc = ACCOUNTS.filter(a=>a.tier==="a2"||a.tier==="b2").sort((a,b)=>a.renew-b.renew).slice(0,6);
  setTimeout(initMap, 0);
  return `
  <div class="panel">
    <h3>Global book <span class="cnt">click a region, then a country · red pulses = at-risk accounts</span>
      <span class="crumbbar" id="crumbs"></span></h3>
    <div style="position:relative;padding:6px 10px 0">
      <div id="worldmap"></div>
      <div id="maptip" class="maptip"></div>
    </div>
    <div id="map-panel"></div>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="l">Net revenue retention</div><div class="v">104.2%</div><div class="d up">▲ 1.8 pts QoQ</div></div>
    <div class="kpi"><div class="l">Gross retention · automated tier</div><div class="v">89.6%</div><div class="d up">▲ 0.9 vs manual baseline</div></div>
    <div class="kpi"><div class="l">Renewals due · 90 days</div><div class="v">${kf$(due90.reduce((s,f)=>s+f.arr,0))}</div><div class="d fl">${due90.length.toLocaleString()} accounts</div></div>
    <div class="kpi"><div class="l">Open escalations</div><div class="v">${esc90.length}</div><div class="d dn">▼ 12 this week</div></div>
    <div class="kpi"><div class="l">Free → paid · MTD</div><div class="v">31</div><div class="d up">▲ $86K new ARR</div></div>
  </div>

  <div class="tierstrip">
    ${Object.entries(TIERS).map(([k,t])=>`
    <div class="tier ${t.cls}" onclick="state.view='accounts';state.tier='${k}';render()">
      <div class="tn">${t.name}</div><div class="td">${t.desc}</div>
      <div class="tv">${counts[k].toLocaleString()} <small>accts</small></div>
      <div class="tm">${arrs[k]} ARR</div>
    </div>`).join("")}
  </div>

  ${sec('esc','Escalation queue', `
    <table>
      <tr><th>Account</th><th>Trigger</th><th class="num">ARR</th><th class="num">Renews</th></tr>
      ${esc.map(a=>`<tr class="click" onclick="state.acct=${a.id};state.view='brief';render()">
        <td><b>${a.name}</b><div class="mini">${a.rep}</div></td>
        <td style="max-width:280px"><span class="mini" style="color:var(--txt2)">${a.trigger||""}</span></td>
        <td class="num">${fmt(a.arr)}</td><td class="num">${a.renew}d</td></tr>`).join("")}
    </table>`, esc.length+' shown')}

  ${sec('auto','Automation — settings, sequences & upcoming renewals', `<div class="secbody">`+renewals()+`</div>`)}
  ${sec('mktall','Marketing signals', `<div class="secbody">`+marketing()+`</div>`)}
  ${sec('freeall','Free-tier pipeline', `<div class="secbody">`+freeView()+`</div>`)}
`;
}

function accounts(){
  let list = ACCOUNTS.filter(a=> (state.tier==="all"||a.tier===state.tier) && a.name.toLowerCase().includes(state.q.toLowerCase()));
  return `
  <div class="fbar">
    <button class="${state.tier==='all'?'on':''}" onclick="state.tier='all';render()">All</button>
    ${Object.entries(TIERS).map(([k,t])=>`<button class="${state.tier===k?'on':''}" onclick="state.tier='${k}';render()">${t.name}</button>`).join("")}
    <input placeholder="Search accounts…" value="${state.q}" oninput="state.q=this.value;render();this.focus();this.setSelectionRange(this.value.length,this.value.length)">
  </div>
  <div class="panel">
    <table>
      <tr><th>Account</th><th>Grade</th><th>Coverage</th><th>Tier</th><th>Health</th><th>Relationship</th><th class="num">ARR</th><th class="num">Potential</th><th class="num">Renews</th><th>Owner</th></tr>
      ${list.map(a=>`<tr class="click" onclick="state.acct=${a.id};state.view='brief';render()">
        <td><b>${a.name}</b><div class="mini">${a.vert} · ${a.loc}</div></td>
        <td><span class="grade g-${a.grade}" title="${a.gradeAuto?'Auto-graded':'Set by rep'}">${a.grade}</span>${a.gradeAuto?"":"<span class='mini' style='margin-left:5px'>✎</span>"}</td>
        <td>${hbar(covScore(a))}</td>
        <td>${badge(a.tier)}</td>
        <td>${hbar(a.health)}</td>
        <td>${hbar(a.rel)}</td>
        <td class="num">${fmt(a.arr)}</td>
        <td class="num" style="color:var(--teal-dk)">+${fmt(a.pot)}</td>
        <td class="num">${a.renew}d</td><td class="mini">${a.rep}</td></tr>`).join("")}
      ${list.length? "": `<tr><td colspan="10" class="emptybar">No accounts match. Clear the search or pick another tier.</td></tr>`}
    </table>
  </div>
  <div class="note">Showing ${list.length} of a simulated 10,000-account book. In production this table is the CRM + telemetry join, refreshed nightly by the scoring engine.</div>`;
}

function brief(){
  const a = ACCOUNTS[state.acct];
  const over = a.assets - a.licensed;
  const c = avatColors[a.id % avatColors.length];
  const playKey = a.tier;
  const cov = covScore(a);
  const ct = contacts(a);
  return `
  <button class="pill-btn ghost" style="margin-bottom:16px" onclick="state.view='accounts';render()">← Accounts</button>
  <div class="brief-head">
    <div class="avat" style="background:${c[0]};color:${c[1]}">${initials(a.name)}</div>
    <div>
      <h2>${a.name}</h2>
      <div class="meta">${a.vert} · ${a.loc} · <a href="#" onclick="state.rep='${a.rep}';state.view='rep';render();return false">${a.rep}</a></div>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
      <span class="grade g-${a.grade}" style="width:30px;height:30px;font-size:15px">${a.grade}</span>
      ${badge(a.tier)}
    </div>
  </div>

  ${a.trigger? `<div class="callout ${a.tier==='b2'?'co-red':'co-warn'}">⚠ <div><b>Why this surfaced:</b> ${a.trigger}</div></div>`:""}

  <div class="statgrid">
    <div class="stat"><div class="l">ARR</div><div class="v">${fmt(a.arr)}</div></div>
    <div class="stat"><div class="l">NRR · YoY</div><div class="v" style="color:${yoy(a)>=100?'var(--teal-dk)':'var(--red-dk)'}">${yoy(a)}%</div></div>
    <div class="stat"><div class="l">Renews in</div><div class="v">${a.renew}d</div></div>
    <div class="stat"><div class="l">Assets / licensed</div><div class="v" style="color:${over>0?'var(--teal-dk)':'inherit'}">${a.assets.toLocaleString()}<span style="font-size:13px;color:var(--txt3)"> / ${a.licensed.toLocaleString()}</span></div></div>
    <div class="stat"><div class="l">Potential</div><div class="v" style="color:var(--teal-dk)">+${fmt(a.pot)}</div></div>
    <div class="stat"><div class="l">Coverage</div><div class="v" style="color:${cov>=65?'var(--teal-dk)':cov>=45?'var(--amber-dk)':'var(--red-dk)'}">${cov}</div></div>
  </div>

  <div class="callout co-play">✦ <div><b>Suggested play</b>${plays[playKey]}</div></div>
  <div class="actions" style="margin-bottom:16px">
    <button onclick="openModal('opener',${a.id})">Draft call opener</button>
    <button onclick="openModal('emails',${a.id})">Last two emails</button>
    <button onclick="openModal('battle',${a.id})">Battlecard</button>
    <button onclick="openModal('timeline',${a.id})">Renewal timeline</button>
  </div>

  ${sec('outreach','Outreach & cadence', `
    ${outreachEvents(a).map(e=>`
    <div class="evt ${e.future?'upcoming':''}">
      <div class="ic ${e.human?'ic-human':e.inbound?'ic-in':e.type==='quote'?'ic-quote':'ic-auto'}">${e.human?"●":e.inbound?"↩":e.type==="quote"?"$":"⚙"}</div>
      <div class="ed">${fdate(e.future? -e.off : e.off)}</div>
      <div class="et"><b>${e.title}</b><div class="mini">${e.to}</div></div>
      <div class="st"><span class="pct ${e.future?'p-mid': e.status.startsWith('Not')?'p-bad':'p-good'}" style="${e.future?'background:var(--slate-bg);color:var(--txt2)':''}">${e.status}</span></div>
      ${["recap","quote","angle","final"].includes(e.type)? `<button onclick="event.stopPropagation();openModal('msg','${a.id}:${e.type}')">View</button>`:""}
    </div>`).join("")}
    <div class="note" style="padding:10px 16px">⚙ automated · ● human · ↩ inbound — to ${ct.champEmail}. Every automated message is composed from this account's own data.</div>
  `, outreachEvents(a).length+' touches')}

  ${sec('usage','Usage & relationship', `
    <table class="kv">
      <tr><td>Assets under management</td><td style="color:var(--teal-dk)">${over>0? "+18% (growing)":"flat"}</td></tr>
      <tr><td>Scan frequency</td><td>${a.health>55?"Weekly, consistent":"Declining — was weekly, now monthly"}</td></tr>
      <tr><td>Vulnerability Insights</td><td style="color:var(--amber-dk)">Never activated</td></tr>
      <tr><td>Active users</td><td>${a.seats[0]} of ${a.seats[1]} seats</td></tr>
      <tr><td>Health score</td><td style="color:${hclr(a.health)}">${a.health}</td></tr>
      <tr><td>Champion</td><td>${a.champion} ${a.champOk?"(verified)":"<span style='color:var(--red-dk)'>(email bounced)</span>"}</td></tr>
      <tr><td>Relationship score</td><td style="color:${hclr(a.rel)}">${a.rel}</td></tr>
      <tr><td>Open tickets</td><td>${a.tickets? "1 — scan errors, frustrated tone":"None"}</td></tr>
    </table>`)}

  ${sec('mkt','Marketing engagement', `
    <table class="kv">
      <tr><td>Email open rate · 12mo</td><td>${a.open}%</td></tr>
      <tr><td>Click-through</td><td>${a.click}%</td></tr>
      <tr><td>Last campaign opened</td><td>${a.lastCamp}</td></tr>
      <tr><td>Nurture track</td><td>${a.mkt}</td></tr>
      <tr><td>Webinar</td><td>${a.webinar? "Attended — shadow IT session":"None"}</td></tr>
    </table>`)}

  ${sec('cov','Coverage — grade '+a.grade+' blanket', `
    <table class="kv">
    ${COVERAGE[a.grade].items.map(it=>{
      const v=a.touch[it.k]||0;
      const done = it.per==="ratio"? v>=90 : it.per==="bool"? v>=1 : v>=it.need;
      const disp = it.per==="ratio"? v+"%" : it.per==="bool"? (v?"On":"Off") : v+" / "+it.need;
      const editable = a.grade==="A"&&["qbr","expand","threads","exec","renew"].includes(it.k);
      return `<tr><td style="width:58%">${done?"✓":"○"} <span style="${done?"":"color:var(--amber-dk)"}">${it.name}</span></td>
      <td style="text-align:right">
        ${editable? `<button style="border:1px solid var(--line2);background:none;border-radius:5px;width:22px;height:22px;font-size:13px" onclick="ACCOUNTS[${a.id}].touch.${it.k}=Math.max(0,ACCOUNTS[${a.id}].touch.${it.k}-1);saveEdit(${a.id},{touch:ACCOUNTS[${a.id}].touch});render()">−</button>
        <b class="spark" style="margin:0 6px">${disp}</b>
        <button style="border:1px solid var(--line2);background:none;border-radius:5px;width:22px;height:22px;font-size:13px" onclick="ACCOUNTS[${a.id}].touch.${it.k}++;saveEdit(${a.id},{touch:ACCOUNTS[${a.id}].touch});render()">+</button>`
        : `<b class="spark">${disp}</b>`}
      </td></tr>`}).join("")}
    </table>
    <div class="note" style="padding:0 16px 12px">${a.grade==="A"?"Log touches with +/− as they happen. Under-covered A accounts are the leading churn indicator.":a.grade==="B"?"B is measured on trigger response, not calendar coverage.":"C coverage is machine health — no human touches required by design."}</div>`, cov+' / 100')}

  ${sec('judge','Rep judgment — override the model', `
    <div class="editrow"><label>Account grade</label>
      <div class="gset">
        ${["A","B","C"].map(g=>`<button class="${a.grade===g?'on':''}" onclick="saveEdit(${a.id},{grade:'${g}',gradeAuto:false});render()">${g}</button>`).join("")}
      </div>
      <span class="mini" style="margin-left:6px">${a.gradeAuto? "Auto-graded":"Set by rep"}</span>
    </div>
    <div class="editrow"><label>Relationship score</label>
      <input type="range" min="0" max="100" step="1" value="${a.rel}" oninput="this.nextElementSibling.textContent=this.value" onchange="saveEdit(${a.id},{rel:+this.value});render()">
      <span class="rv">${a.rel}</span>
    </div>
    <div class="editrow"><label>Potential ($/yr)</label>
      <input type="number" min="0" step="100" value="${a.pot}" style="width:110px" onchange="saveEdit(${a.id},{pot:+this.value});render()">
      <span class="mini">Whitespace the model can't see</span>
    </div>
    <div class="editrow" style="align-items:flex-start"><label style="padding-top:7px">Rep notes</label>
      <textarea placeholder="Context for the next touch…" onchange="saveEdit(${a.id},{notes:this.value})">${a.notes||""}</textarea>
    </div>`)}
  `;
}

function team(){
  return `
  <div class="panel">
    <h3>Team <span class="cnt">5 reps · click any row for their full page</span></h3>
    <table>
      <tr><th>Rep</th><th>Region</th><th class="num">Book ARR</th><th class="num">Accounts</th><th class="num">NRR</th><th class="num">GRR</th><th class="num">YTD</th><th class="num">Committed / best</th><th class="num">Escalations</th></tr>
      ${REPS.map(r=>{
        const m=REP_META[r], book=FULL.filter(f=>f.rep===r);
        const arr=book.reduce((s,f)=>s+f.arr,0);
        const escN=book.filter(f=>f.trigger&&f.arr>SEQCFG.escalate).length;
        const region=r.match(/\((.*)\)/)[1];
        return `<tr class="click" onclick="state.rep='${r}';state.view='rep';render()">
          <td><b>${r.split(" (")[0]}</b><div class="mini">${m.focus}</div></td>
          <td><span class="badge b-b1">${region}</span></td>
          <td class="num"><b>${kf$(arr)}</b></td>
          <td class="num">${book.length.toLocaleString()}</td>
          <td class="num">${pctChip(m.nrr)}</td>
          <td class="num">${pctChip(m.grr,90,87)}</td>
          <td class="num">${pctChip(m.ytd,67,55)}</td>
          <td class="num">${kf$(m.committed)} <span class="mini">/ ${kf$(m.best)}</span></td>
          <td class="num"><b>${escN}</b></td>
        </tr>`}).join("")}
    </table>
  </div>
  <div class="note">NRR ≥ 100 is green. GRR target is 90. YTD pace target is 67% at this point in the year. Escalations = at-risk accounts above the ${kf$(SEQCFG.escalate)} routing threshold — the number that should trend down as coverage improves.</div>`;
}

function repPage(){
  state.rep = state.rep || REPS[0];
  const r = state.rep, m = REP_META[r];
  const mine = FULL.filter(f=>f.rep===r);
  const g = G => mine.filter(f=>f.bookGrade===G);
  const A=g("A"),B=g("B"),C=g("C");
  const $of = arr => arr.reduce((s,f)=>s+f.arr,0);
  const worklist = mine.filter(f=>f.trigger && (f.bookGrade!=="C" || f.arr>SEQCFG.escalate)).sort((x,y)=>x.renew-y.renew).slice(0,10);
  const expand = mine.filter(f=>!f.trigger && f.bookGrade==="A" && f.pot>f.arr*.5).sort((x,y)=>y.pot-x.pot).slice(0,6);
  const accs = ACCOUNTS.filter(a=>a.rep===r);
  const covAvg = accs.length? Math.round(accs.reduce((s,a)=>s+covScore(a),0)/accs.length):0;
  const pct = n => Math.round(n/mine.length*100);
  const emails30 = Math.round(mine.filter(f=>f.renew<=SEQCFG.recapDay).length*1.4);
  const quotes30 = mine.filter(f=>f.renew<=SEQCFG.quoteDay).length;
  return `
  <button class="pill-btn ghost" style="margin-bottom:16px" onclick="state.view='team';render()">← Team</button>
  <div class="brief-head">
    <div class="avat" style="background:var(--blue-bg);color:var(--blue-dk)">${initials(r)}</div>
    <div><h2>${r.split(" (")[0]}</h2><div class="meta">${r.match(/\((.*)\)/)[1]} · ${m.focus}</div></div>
  </div>

  <div class="panel">
    <div class="statrow">
      <div class="statcell"><div class="sl">Book ARR</div><div class="sv">${kf$($of(mine))}</div><div class="ss">${mine.length.toLocaleString()} accounts</div></div>
      <div class="statcell"><div class="sl">NRR</div><div class="sv" style="color:${m.nrr>=100?'var(--teal-dk)':'var(--red-dk)'}">${m.nrr}%</div><div class="ss">trailing 12mo</div></div>
      <div class="statcell"><div class="sl">GRR</div><div class="sv" style="color:${m.grr>=90?'var(--teal-dk)':m.grr>=87?'var(--amber-dk)':'var(--red-dk)'}">${m.grr}%</div><div class="ss">target 90</div></div>
      <div class="statcell"><div class="sl">YTD vs quota</div><div class="sv">${m.ytd}%</div><div class="ss">of ${kf$(m.quota)}</div></div>
      <div class="statcell"><div class="sl">Committed / best</div><div class="sv">${kf$(m.committed)}</div><div class="ss">best ${kf$(m.best)}</div></div>
      <div class="statcell"><div class="sl">A-book coverage</div><div class="sv" style="color:${covAvg>=65?'var(--teal-dk)':covAvg>=45?'var(--amber-dk)':'var(--red-dk)'}">${covAvg}</div><div class="ss">avg, sampled</div></div>
    </div>
    <div class="autoline">
      <span>Automated · 30d:</span>
      <span><b>${C.length.toLocaleString()}</b> accts self-running (<b>${kf$($of(C))}</b>)</span>
      <span><b>${emails30.toLocaleString()}</b> emails</span>
      <span><b>${quotes30.toLocaleString()}</b> quotes</span>
      <span><b>41%</b> self-serve renewals</span>
    </div>
    <div style="padding:14px 16px">
      <div style="display:flex;height:30px;border-radius:7px;overflow:hidden;font-size:12px;font-weight:600">
        <div style="width:${pct(A.length)+6}%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;min-width:96px">A · ${A.length}</div>
        <div style="width:${pct(B.length)+8}%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;min-width:96px">B · ${B.length}</div>
        <div style="width:${pct(C.length)}%;background:var(--slate-bg);color:#3D4A56;display:flex;align-items:center;justify-content:center">C · ${C.length.toLocaleString()} automated</div>
      </div>
      <div class="mini" style="margin-top:8px">A = quarterly proactive (${kf$($of(A))}) · B = triggered only (${kf$($of(B))}) · C = automated (${kf$($of(C))}), zero hours unless escalated</div>
    </div>
  </div>

  ${sec('queue','Queue — escalations to work', `
    <table>
      <tr><th>Account</th><th class="num">ARR</th><th class="num">Renews</th><th>Why it's here</th></tr>
      ${worklist.map(f=>`<tr ${f.featured?`class="click" onclick="state.acct=${f.id};state.view='brief';render()"`:""}>
        <td><b>${f.name}</b>${f.featured?'<div class="mini">Click for full page</div>':''}</td>
        <td class="num">${fmt(f.arr)}</td><td class="num">${f.renew}d</td>
        <td class="mini" style="max-width:240px">${f.trigger}</td></tr>`).join("")}
    </table>`, worklist.length+' now')}

  ${sec('expand','Expansion plays — biggest whitespace', `
    <table>
      <tr><th>Account</th><th class="num">ARR</th><th class="num">Potential</th></tr>
      ${expand.map(f=>`<tr ${f.featured?`class="click" onclick="state.acct=${f.id};state.view='brief';render()"`:""}>
        <td><b>${f.name}</b></td><td class="num">${fmt(f.arr)}</td>
        <td class="num" style="color:var(--teal-dk)">+${fmt(f.pot)}</td></tr>`).join("")}
    </table>`)}

  ${sec('sampled','Named accounts', `
    <table>
      <tr><th>Grade</th><th>Account</th><th class="num">ARR</th><th class="num">NRR</th><th class="num">Potential</th><th class="num">Coverage</th><th class="num">Renews</th></tr>
      ${["A","B","C"].flatMap(G=>accs.filter(a=>a.grade===G).sort((x,y)=>y.arr-x.arr).map(a=>`
      <tr class="click" onclick="state.acct=${a.id};state.view='brief';render()">
        <td><span class="grade g-${G}">${G}</span></td>
        <td><b>${a.name}</b><div class="mini">${a.vert} · ${a.loc}</div></td>
        <td class="num"><b>${fmt(a.arr)}</b></td>
        <td class="num">${pctChip(yoy(a))}</td>
        <td class="num" style="color:var(--teal-dk)">+${fmt(a.pot)}</td>
        <td class="num">${pctChip(covScore(a),65,45)}</td>
        <td class="num">${a.renew}d</td>
      </tr>`)).join("")}
    </table>
    <div class="note" style="padding:9px 16px">Sampled from the full ${mine.length.toLocaleString()}-account book — the rest run in the triggered and automated motions above.</div>`, accs.length+' sampled')}
  `;
}

function renewals(){

// ---------- world map drill-down ----------
let WORLD=null, MAP=null, MAPSTATE={region:null,country:null};
const kf$ = n => "$"+(n>=1000000? (n/1000000).toFixed(2)+"M" : Math.round(n/1000)+"K");

async function initMap(){
  const host = document.getElementById("worldmap");
  if(!host) return;
  if(typeof d3==="undefined" || typeof topojson==="undefined"){ mapPanel(); crumbs(); return; }
  try{
    if(!WORLD) WORLD = await (await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")).json();
  }catch(e){ mapPanel(); crumbs(); return; }
  const feats = topojson.feature(WORLD, WORLD.objects.countries).features
    .filter(f=>f.properties.name!=="Antarctica");
  const W=960,H=410;
  const proj = d3.geoNaturalEarth1().fitSize([W,H],{type:"FeatureCollection",features:feats});
  const path = d3.geoPath(proj);
  host.innerHTML="";
  const svg = d3.select(host).append("svg").attr("viewBox",`0 0 ${W} ${H}`);
  const g = svg.append("g");
  const stats = geoStats();
  const tip = document.getElementById("maptip");

  g.selectAll("path").data(feats).join("path")
    .attr("class",d=>{const r=regionOfCountry(d.properties.name);return "country"+(r?" inplay":"")})
    .attr("d",path)
    .attr("fill",d=>{
      const n=d.properties.name, r=regionOfCountry(n);
      if(!r) return "#E8ECEE";
      return stats[n]? GEO[r].color : GEO[r].light;
    })
    .on("mousemove",(e,d)=>{
      const n=d.properties.name, r=regionOfCountry(n);
      if(!r){tip.style.opacity=0;return}
      const s=stats[n];
      tip.innerHTML = s? `<b>${n}</b> · ${kf$(s.arr)} ARR · ${s.accs.length} accts${s.risk?` · <span style="color:#F09595">${s.risk} at risk</span>`:""}` : `<b>${n}</b> · whitespace`;
      const rect=host.getBoundingClientRect();
      tip.style.left=(e.clientX-rect.left)+"px"; tip.style.top=(e.clientY-rect.top)+"px"; tip.style.opacity=1;
    })
    .on("mouseleave",()=>tip.style.opacity=0)
    .on("click",(e,d)=>{
      const n=d.properties.name, r=regionOfCountry(n);
      if(!r) return;
      if(MAPSTATE.region!==r){ MAPSTATE={region:r,country:null}; }
      else if(stats[n]){ MAPSTATE.country = MAPSTATE.country===n? null : n; }
      applyZoom(); mapPanel(); crumbs();
    });

  // risk pulse dots at country centroids
  Object.entries(stats).forEach(([n,s])=>{
    if(!s.risk) return;
    const f = feats.find(f=>f.properties.name===n); if(!f) return;
    const [cx,cy] = path.centroid(f);
    g.append("circle").attr("class","risk-ping").attr("cx",cx).attr("cy",cy).attr("r",3);
    g.append("circle").attr("class","risk-dot").attr("cx",cx).attr("cy",cy).attr("r",3);
  });

  MAP = {svg,g,path,feats,W,H};
  applyZoom(false); mapPanel(); crumbs();
}

function applyZoom(animate=true){
  if(!MAP) return;
  const {g,path,feats,W,H} = MAP;
  let target=null;
  if(MAPSTATE.country){ target = feats.filter(f=>f.properties.name===MAPSTATE.country); }
  else if(MAPSTATE.region){ target = feats.filter(f=>GEO[MAPSTATE.region].countries.includes(f.properties.name)); }
  let t = "translate(0,0) scale(1)";
  if(target && target.length){
    const b = path.bounds({type:"FeatureCollection",features:target});
    const dx=b[1][0]-b[0][0], dy=b[1][1]-b[0][1], x=(b[0][0]+b[1][0])/2, y=(b[0][1]+b[1][1])/2;
    const s = Math.min(6, .85/Math.max(dx/W, dy/H));
    t = `translate(${W/2-s*x},${H/2-s*y}) scale(${s})`;
  }
  (animate? g.transition().duration(650).ease(d3.easeCubicOut) : g).attr("transform",t);
}

function crumbs(){
  const el=document.getElementById("crumbs"); if(!el) return;
  let h = `<button onclick="MAPSTATE={region:null,country:null};applyZoom();mapPanel();crumbs()">World</button>`;
  if(MAPSTATE.region) h += `<span>/</span><button onclick="MAPSTATE.country=null;applyZoom();mapPanel();crumbs()">${MAPSTATE.region}</button>`;
  if(MAPSTATE.country) h += `<span>/</span><b>${MAPSTATE.country}</b>`;
  el.innerHTML=h;
}

function mapPanel(){
  const el=document.getElementById("map-panel"); if(!el) return;
  const stats = geoStats();
  if(!MAPSTATE.region){
    el.innerHTML = `<div class="geo-grid">${Object.entries(GEO).map(([r,cfg])=>{
      const cs = cfg.countries.filter(c=>stats[c]);
      const arr = cs.reduce((s,c)=>s+stats[c].arr,0), pot = cs.reduce((s,c)=>s+stats[c].pot,0);
      const n = cs.reduce((s,c)=>s+stats[c].nAll,0), risk = cs.reduce((s,c)=>s+stats[c].risk,0);
      const reps = new Set(); cs.forEach(c=>stats[c].reps.forEach(x=>reps.add(x)));
      return `<div class="geo-card" style="--gc:${cfg.color}" onclick="MAPSTATE={region:'${r}',country:null};applyZoom();mapPanel();crumbs()">
        <div class="gn">${r}</div><div class="gv">${kf$(arr)}</div>
        <div class="gm">+${kf$(pot)} potential · ${n.toLocaleString()} accounts<br>${reps.size} reps${risk?` · <span style="color:var(--red-dk)">${risk} at risk</span>`:""}</div></div>`;
    }).join("")}</div>`;
    return;
  }
  if(!MAPSTATE.country){
    const cfg=GEO[MAPSTATE.region];
    const cs = cfg.countries.filter(c=>stats[c]).sort((a,b)=>stats[b].arr-stats[a].arr);
    el.innerHTML = `<div class="geo-grid">${cs.map(c=>{const s=stats[c];
      return `<div class="geo-card" style="--gc:${cfg.color}" onclick="MAPSTATE.country='${c}';applyZoom();mapPanel();crumbs()">
        <div class="gn">${c}</div><div class="gv">${kf$(s.arr)}</div>
        <div class="gm">+${kf$(s.pot)} potential · ${s.nAll.toLocaleString()} accts${s.risk?` · <span style="color:var(--red-dk)">${s.risk} at risk</span>`:""}<br>${[...s.reps].map(r=>r.split(" (")[0]).join(", ")||"Automated only"}</div></div>`;
    }).join("")}
    <div class="geo-card" style="--gc:#B4B2A9;cursor:default">
      <div class="gn">Whitespace</div><div class="gv" style="font-size:14px;font-weight:500;color:var(--txt2)">${cfg.countries.filter(c=>!stats[c]).length} countries, no accounts</div>
      <div class="gm">Free-tier installs are the beachhead here</div></div></div>`;
    return;
  }
  const s = stats[MAPSTATE.country];
  el.innerHTML = `
  <div style="padding:12px 16px 4px;display:flex;gap:20px;flex-wrap:wrap;font-size:13px">
    <span><b class="spark" style="font-size:16px">${kf$(s.arr)}</b> <span class="mini">ARR</span></span>
    <span><b class="spark" style="font-size:16px;color:var(--teal-dk)">+${kf$(s.pot)}</b> <span class="mini">potential</span></span>
    <span><b class="spark" style="font-size:16px">${s.nAll.toLocaleString()}</b> <span class="mini">accounts</span></span>
    <span class="mini" style="align-self:center">Coverage: ${[...s.reps].join(", ")||"fully automated"}</span>
  </div>
  <table>
    <tr><th>Account</th><th>Grade</th><th>Tier</th><th class="num">ARR</th><th class="num">Renews</th><th>Owner</th></tr>
    ${s.accs.sort((a,b)=>b.arr-a.arr).map(a=>`<tr class="click" onclick="state.acct=${a.id};state.view='brief';render()">
      <td><b>${a.name}</b><div class="mini">${a.vert} · ${a.loc}</div></td>
      <td><span class="grade g-${a.grade}">${a.grade}</span></td>
      <td>${badge(a.tier)}</td>
      <td class="num">${fmt(a.arr)}</td><td class="num">${a.renew}d</td><td class="mini">${a.rep}</td></tr>`).join("")}
    <tr><td colspan="6" class="mini" style="padding:10px 16px">+ ${(s.nAll - s.accs.length).toLocaleString()} more accounts in this country running in the triggered and automated motions — shown are the named drill-through samples.</td></tr>
  </table>`;
}

Replied to the 90-day renewal notice. Asked whether the quote reflects "current asset counts" and mentioned they are "also looking at Axonius for the security side." Tone: transactional, not hostile. Classified: competitor mention → escalated.

2 — Jun 14 · outbound (automated usage recap)
AI-personalized recap citing 18% asset growth and weekly scan cadence. Opened 3×, clicked the asset-report link. No reply.

Read: engagement is high and usage is growing — this is a negotiation posture, not a churn posture.`}},
  battle:{t:"Competitive battlecard · Axonius", ai:true, b:id=>`Category difference (say this out loud): We start with discovery — finding what exists. Axonius starts with aggregation — reconciling data from security tools you already own. Without a rich security stack to feed it, it's an expensive empty layer. Ask: "What stack would Axonius be aggregating for you?"

Price reality: their verified mid-market deals run $60–130K/year. This account pays $14.2K. The mention is leverage roughly 80% of the time at this ARR band.

Where they genuinely win: mature enterprises with 10+ security tools needing control validation. Concede it — "great platform for a 20,000-asset enterprise" — then reframe to fit.

Counter-move: don't defend price. They're 1,140 assets over license — the renewal is actually an upgrade conversation you control. Tier up, activate Vulnerability Insights (answers the security itch), price-protect at signing.`},
  msg:{t:"Sent message — composed per account", ai:true, b:arg=>{
    const [id,type]=String(arg).split(":");
    return draftMsg(ACCOUNTS[+id], type);
  }},
  timeline:{t:"Renewal timeline — what runs itself", ai:false, b:id=>{
    const a = ACCOUNTS[id]; const top = a.tier[0]==="a";
    const steps = [
      ...(SEQCFG.recap?[["−"+SEQCFG.recapDay+"d","Value recap email, drafted per-account from live telemetry (their scan counts, asset growth)","AUTO"]]:[]),
      ...(top? [["−100d","Rep QBR-style touch — 15-min call or personal email, prompted by the system with a generated brief","HUMAN"]]:[]),
      ...(SEQCFG.quote?[["−"+SEQCFG.quoteDay+"d","Quote generated from current asset count and sent with e-sign + self-serve payment link","AUTO"]]:[]),
      ...(SEQCFG.angle?[["−"+SEQCFG.angleDay+"d","Security-angle follow-up — only fires for non-openers of the quote email","AUTO"]]:[]),
      ...(SEQCFG.final?[["−"+SEQCFG.finalDay+"d","Final notice with price-lock framing; escalation armed","AUTO"]]:[]),
      ["Any reply","Classified in real time (renewing / price objection / champion change / competitor / ghost) and routed","AUTO"],
      ["Price objection <$"+SEQCFG.discount,"Approved auto-discount path offered without human involvement","AUTO"],
      ["Competitor mention, champion change, or ARR >"+kf$(SEQCFG.escalate)+" at risk","Escalates to ${REP} with generated account brief","HUMAN"],
      ["Renewal day","Auto-renews on e-sign; lapse triggers win-back sequence at +15d","AUTO"],
      ...(SEQCFG.silence?[["3 straight silent renewals","Manufactured touchpoint — usage report that invites reply — so no revenue goes unexamined","AUTO"]]:[])
    ];
    return steps.map(s=>`${s[2]==="AUTO"?"⚙ AUTOMATED":"● HUMAN"} · ${s[0]}
${s[1].replace("${REP}", a.rep==="Automated"?"the regional rep":a.rep)}
`).join("\n") + `\nFor ${a.name}: ${a.renew} days out, ${top? "top tier — the two human touches above are on "+a.rep+"'s queue":"long-tail tier — zero human hours unless an escalation rule fires"}.`;
  }},
};
function openModal(key,arg){
  const m = MODALS[key];
  $("#mttl").innerHTML = m.t + (m.ai? ' <span class="ai">AI generated</span>':"");
  $("#mbody").textContent = typeof m.b==="function"? m.b(arg): m.b;
  $("#modalbg").classList.add("show");
}
function closeModal(){$("#modalbg").classList.remove("show")}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeModal();
  if(e.target.tagName==="INPUT")return;
  const map={1:"dash",2:"team",3:"accounts"};
  if(map[e.key]){state.view=map[e.key];render()}
});
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{state.view=b.dataset.v;render()});
render();
</script>
